<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ely. — Design & Marketing</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23DD073E'/><text x='16' y='23' font-family='-apple-system,sans-serif' font-size='20' font-weight='800' fill='%23FFF7CD' text-anchor='middle'>e</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Inter cobre quem não está em Apple; no Mac e no iPhone o SF Pro entra sozinho -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* SF Pro primeiro; Inter só como rede de segurança fora do ecossistema Apple */
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    /* =========================================================
       PALETA — MODO CLARO
       Toda a cor nasce aqui. Para trocar o visual, edite só
       este bloco e o de modo escuro abaixo.
       ========================================================= */
    --backdrop:#E7DFCE;         /* areia: fora da moldura */
    --bg:#FFFDF4;               /* creme: dentro da moldura */
    --surface:#F4EEDF;          /* cards e blocos */
    --surface-2:#FFF7CD;        /* offwhite: pílulas e realces */
    --text:#301E0D;             /* escura */
    --text-soft:#5C4224;
    --muted:#93795A;
    --accent:#DD073E;           /* principal */
    --accent-deep:#B00531;
    --gold:#D8A649;             /* secundária do gradiente */
    --on-accent:#FFF7CD;
    --ink:48,30,13;             /* RGB de --text: base dos fios e realces */

    --hairline:rgba(var(--ink),.12);
    --hairline-soft:rgba(var(--ink),.07);

    --r-shell:30px;             /* a moldura */
    --r-card:22px;              /* cards */
    --r-inner:16px;             /* imagens dentro dos cards */
    --maxw:1420px;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  /* ---------- PALETA — MODO ESCURO ---------- */
  [data-theme="dark"]{
    --backdrop:#170F06;
    --bg:#241708;
    --surface:#33200E;
    --surface-2:#42290F;
    --text:#FFF7CD;
    --text-soft:#E2D2A6;
    --muted:#A98F66;
    --accent:#FF4A6E;
    --accent-deep:#FF6B88;
    --gold:#E8BC63;
    --on-accent:#2A1A0A;
    --ink:255,247,205;
    --hairline:rgba(var(--ink),.14);
    --hairline-soft:rgba(var(--ink),.08);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--backdrop);color:var(--text);
    font-family:var(--font);font-size:17px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding:clamp(10px,1.4vw,22px);
    transition:background .4s var(--ease),color .4s var(--ease);
  }
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  .eyebrow{
    font-size:.7rem;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);
  }

  /* ---------- A moldura ---------- */
  .shell{
    max-width:var(--maxw);margin:0 auto;
    background:var(--bg);border-radius:var(--r-shell);
    overflow:hidden;position:relative;
  }
  .pad{padding-inline:clamp(24px,3.6vw,58px)}

  /* ---------- Header ---------- */
  header{position:sticky;top:0;z-index:60;background:var(--bg)}
  .nav{
    display:flex;align-items:center;gap:clamp(10px,1.6vw,20px);
    padding-block:clamp(14px,1.6vw,22px);
  }
  .logo{display:flex;align-items:center;flex-shrink:0;color:var(--text)}
  .logo svg{height:clamp(21px,2.3vw,27px);width:auto;display:block}
  .nav-pill{
    display:flex;align-items:center;gap:.15rem;
    background:var(--surface);border-radius:100px;padding:5px;
  }
  .nav-pill a{
    font-size:.87rem;font-weight:500;padding:.5rem .95rem;
    border-radius:100px;transition:background .25s var(--ease),color .25s var(--ease);
  }
  .nav-pill a:hover{background:var(--bg);color:var(--accent)}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:.5rem}

  .btn{
    font-family:var(--font);font-weight:600;cursor:pointer;white-space:nowrap;
    border:0;border-radius:100px;transition:all .25s var(--ease);
    display:inline-flex;align-items:center;gap:.6rem;
  }
  .btn .arw{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;
    display:grid;place-items:center;font-size:.78rem;line-height:1;
    transition:transform .3s var(--ease);
  }
  .btn:hover .arw{transform:translateX(2px)}
  .btn-primary{background:var(--accent);color:var(--on-accent);padding:.5rem .5rem .5rem 1.1rem;font-size:.87rem}
  .btn-primary .arw{background:var(--on-accent);color:var(--accent)}
  .btn-primary:hover{background:var(--accent-deep)}
  .btn-ghost{background:var(--surface);color:var(--text);padding:.5rem .5rem .5rem 1.1rem;font-size:.87rem}
  .btn-ghost .arw{background:var(--bg);color:var(--text)}
  .btn-lg{font-size:1rem;padding:.62rem .62rem .62rem 1.4rem}
  .btn-lg .arw{width:32px;height:32px;font-size:.86rem}

  .icon-btn{
    width:40px;height:40px;border-radius:50%;flex-shrink:0;
    border:0;background:var(--surface);color:var(--text);
    cursor:pointer;display:grid;place-items:center;
    transition:all .25s var(--ease);
  }
  .icon-btn:hover{background:var(--surface-2);color:var(--accent)}
  .icon-btn svg{width:17px;height:17px}
  .icon-btn .moon{display:none}
  [data-theme="dark"] .icon-btn .sun{display:none}
  [data-theme="dark"] .icon-btn .moon{display:block}

  .lang{display:flex;background:var(--surface);border-radius:100px;padding:4px;flex-shrink:0}
  .lang button{
    border:0;background:none;cursor:pointer;font-family:var(--font);
    font-size:.76rem;font-weight:700;color:var(--muted);
    padding:.32rem .62rem;border-radius:100px;transition:all .22s var(--ease);
  }
  .lang button.active{background:var(--bg);color:var(--text)}

  /* ---------- Hero ---------- */
  .hero{padding-block:clamp(40px,6vw,86px) clamp(28px,3.4vw,44px)}
  .hero h1{
    font-weight:900;font-size:clamp(2.6rem,7.4vw,6.1rem);
    line-height:.95;letter-spacing:-.045em;max-width:17ch;
  }
  .hero h1 em{font-style:normal;color:var(--accent)}
  .hero-sub{
    margin-top:clamp(20px,2.4vw,32px);max-width:46ch;
    font-size:clamp(1rem,1.2vw,1.16rem);color:var(--text-soft);line-height:1.55;
  }
  .hero-sub b{font-weight:600;color:var(--text)}
  .hero-actions{margin-top:clamp(26px,3vw,40px);display:flex;gap:.7rem;flex-wrap:wrap}

  /* ---------- Serviços ---------- */
  .svc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:clamp(12px,1.4vw,18px)}
  .svc{
    background:var(--surface);border-radius:var(--r-card);
    padding:clamp(20px,2.1vw,30px);display:flex;flex-direction:column;
  }
  .svc-n{
    font-size:.72rem;font-weight:700;letter-spacing:.12em;color:var(--accent);
    margin-bottom:clamp(34px,4.6vw,64px);
  }
  .svc:nth-child(even) .svc-n{color:var(--gold)}
  .svc h3{
    font-weight:900;font-size:clamp(1.05rem,1.35vw,1.32rem);
    letter-spacing:-.032em;line-height:1.04;margin-bottom:.55rem;
  }
  .svc p{font-size:.87rem;color:var(--muted);line-height:1.5}

  /* ---------- Marcas ---------- */
  .brands{
    margin-top:clamp(44px,5.4vw,78px);padding:clamp(20px,2.4vw,30px) 0 0;
    border-top:1px solid var(--hairline);
    position:relative;overflow:hidden;
    mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);
  }
  .brands-track{display:flex;width:max-content;align-items:center;gap:clamp(38px,5vw,74px);animation:slide 34s linear infinite}
  .brands:hover .brands-track{animation-play-state:paused}
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .brand-ph{
    flex-shrink:0;white-space:nowrap;
    font-size:.95rem;font-weight:600;color:var(--muted);
    letter-spacing:-.01em;
  }
  .brand-logo{height:clamp(22px,2.4vw,30px);width:auto;flex-shrink:0;filter:grayscale(1) opacity(.42)}

  /* ---------- Cabeçalho de seção ---------- */
  .section{padding-block:clamp(52px,7vw,110px)}
  .sec-head{margin-bottom:clamp(26px,3vw,42px)}
  .sec-head .eyebrow{display:block;margin-bottom:.9rem}
  .sec-head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:1.4rem;flex-wrap:wrap}
  .sec-head h2{
    font-weight:900;font-size:clamp(1.9rem,4.4vw,3.5rem);
    line-height:.98;letter-spacing:-.042em;max-width:22ch;
  }
  .sec-head .count{font-size:.88rem;color:var(--muted);font-weight:500;padding-bottom:.35rem}

  /* ---------- Filtros ---------- */
  .filters{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:clamp(20px,2.4vw,30px)}
  .filter{
    font-family:var(--font);font-size:.85rem;font-weight:500;cursor:pointer;
    padding:.52rem 1.05rem;border-radius:100px;border:0;
    background:var(--surface);color:var(--text-soft);
    transition:all .22s var(--ease);
  }
  .filter:hover{background:var(--surface-2);color:var(--text)}
  .filter.active{background:var(--text);color:var(--bg)}

  /* ---------- Cards de trabalho ---------- */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,1.6vw,22px)}
  .card{
    background:var(--surface);border-radius:var(--r-card);
    overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
    opacity:0;transform:translateY(18px);
    transition:opacity .6s var(--ease),transform .6s var(--ease),background .3s var(--ease);
  }
  .card.in{opacity:1;transform:none}
  .card:hover{background:var(--accent)}
  .card:hover .tag{background:var(--on-accent);color:var(--accent)}
  .card:hover h3,.card:hover .card-desc{color:var(--on-accent)}
  .card-head{padding:clamp(16px,1.5vw,22px) clamp(16px,1.5vw,22px) clamp(14px,1.4vw,20px)}
  .card-tags{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:clamp(14px,1.6vw,22px)}
  .tag{
    background:var(--bg);color:var(--text-soft);
    font-size:.72rem;font-weight:600;letter-spacing:-.005em;
    padding:.28rem .68rem;border-radius:100px;white-space:nowrap;
    transition:background .3s var(--ease),color .3s var(--ease);
  }
  .card h3{
    transition:color .3s var(--ease);
    font-weight:900;font-size:clamp(1.15rem,1.6vw,1.6rem);
    line-height:1;letter-spacing:-.035em;
  }
  .card-desc{font-size:.85rem;color:var(--muted);margin-top:.5rem;line-height:1.45;transition:color .3s var(--ease)}
  .card-art{position:relative;margin:0 clamp(8px,.8vw,10px) clamp(8px,.8vw,10px);border-radius:var(--r-inner);overflow:hidden;background:var(--bg)}
  .card-art img{width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform .6s var(--ease)}
  .card:hover .card-art img{transform:scale(1.035)}
  .card-cta{
    position:absolute;left:12px;bottom:12px;
    display:inline-flex;align-items:center;gap:.5rem;
    background:rgba(255,255,255,.86);backdrop-filter:blur(10px);
    color:#301E0D;font-size:.8rem;font-weight:600;
    padding:.34rem .34rem .34rem .8rem;border-radius:100px;
    opacity:0;transform:translateY(6px);
    transition:opacity .3s var(--ease),transform .3s var(--ease);
  }
  .card-cta .arw{width:22px;height:22px;border-radius:50%;background:#301E0D;color:#FFF7CD;display:grid;place-items:center;font-size:.68rem}
  .card:hover .card-cta{opacity:1;transform:none}

  /* ---------- Sobre ---------- */
  .about{
    background:var(--surface);border-radius:var(--r-card);
    display:grid;grid-template-columns:1.15fr .85fr;overflow:hidden;
  }
  .about-text{
    padding:clamp(24px,3vw,52px);
    display:flex;flex-direction:column;justify-content:center;
    border-right:1px solid var(--hairline-soft);
  }
  .about-text .eyebrow{margin-bottom:1rem}
  .about-text h2{
    font-weight:900;font-size:clamp(1.5rem,2.6vw,2.4rem);
    line-height:.98;letter-spacing:-.04em;margin-bottom:1.2rem;
  }
  .about-sub{font-size:1.02rem;font-weight:600;margin-bottom:.9rem}
  .about-text p{color:var(--text-soft);font-size:.95rem;line-height:1.6;margin-bottom:.85rem;max-width:52ch}
  .about-text p b{font-weight:600;color:var(--text)}
  .about-tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.7rem}
  .about-tag{
    font-size:.74rem;font-weight:600;padding:.3rem .7rem;border-radius:100px;
    background:var(--bg);color:var(--text-soft);
    opacity:0;transform:translateY(6px);
    transition:opacity .4s var(--ease),transform .4s var(--ease);
  }
  .about-tag.in{opacity:1;transform:none}
  .about-photo{position:relative;min-height:clamp(320px,42vw,560px)}
  .about-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%}

  /* ---------- Contato ---------- */
  .contact{
    background:var(--text);color:var(--bg);
    border-radius:var(--r-card);padding:clamp(36px,5.4vw,86px) clamp(24px,3.4vw,64px);
  }
  .contact .eyebrow{color:color-mix(in srgb,var(--bg) 58%,transparent);display:block;margin-bottom:1.1rem}
  .contact h2{
    font-weight:900;font-size:clamp(2.1rem,6vw,4.6rem);
    line-height:.94;letter-spacing:-.045em;max-width:20ch;
  }
  .contact h2 em{font-style:normal;color:var(--accent)}
  .contact-row{margin-top:clamp(28px,3.4vw,46px);display:flex;align-items:center;gap:1.6rem;flex-wrap:wrap}
  .contact .btn-primary{background:var(--accent);color:var(--on-accent)}
  .socials{display:flex;gap:.6rem;flex-wrap:wrap}
  .social{
    display:inline-flex;align-items:center;gap:.55rem;
    padding:.56rem 1.15rem;border-radius:100px;
    border:1px solid color-mix(in srgb,var(--bg) 28%,transparent);
    color:color-mix(in srgb,var(--bg) 86%,transparent);
    font-size:.88rem;font-weight:500;
    transition:border-color .25s var(--ease),color .25s var(--ease);
  }
  .social svg{width:16px;height:16px;flex-shrink:0}
  .social:hover{border-color:var(--gold);color:var(--gold)}

  /* ---------- Rodapé ---------- */
  footer{
    padding-block:clamp(26px,3vw,44px);
    display:flex;justify-content:space-between;align-items:center;
    gap:1rem;flex-wrap:wrap;font-size:.82rem;color:var(--muted);
  }
  footer a:hover{color:var(--accent)}

  /* ---------- Overlay de projeto ---------- */
  .ov{
    position:fixed;inset:0;z-index:200;
    display:flex;align-items:flex-end;justify-content:center;
    background:rgba(0,0,0,0);visibility:hidden;pointer-events:none;
    transition:background .35s var(--ease),visibility 0s .36s;
  }
  .ov.open{background:rgba(0,0,0,.55);visibility:visible;pointer-events:all;transition:background .35s var(--ease),visibility 0s 0s}
  .ov-panel{
    width:100%;max-width:1120px;max-height:94vh;overflow-y:auto;
    background:var(--bg);border-radius:var(--r-shell) var(--r-shell) 0 0;
    transform:translateY(100%);transition:transform .42s var(--ease);
  }
  .ov.open .ov-panel{transform:translateY(0)}
  .ov-bar{
    position:sticky;top:0;z-index:2;background:var(--bg);
    padding:clamp(16px,2vw,24px) clamp(20px,3vw,42px);
    display:flex;align-items:center;justify-content:space-between;gap:1rem;
    border-bottom:1px solid var(--hairline-soft);
  }
  .ov-bar .eyebrow{color:var(--accent)}
  .ov-body{padding:clamp(22px,3vw,42px) clamp(20px,3vw,42px) clamp(40px,5vw,72px)}
  .ov-body h2{font-weight:900;font-size:clamp(1.7rem,4vw,2.8rem);letter-spacing:-.042em;line-height:.98;margin-bottom:.7rem}
  .ov-desc{font-size:1rem;color:var(--text-soft);line-height:1.6;max-width:60ch;margin-bottom:clamp(22px,2.6vw,36px)}
  .ov-imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
  .ov-imgs.stack{grid-template-columns:1fr}
  .ov-imgs > div{border-radius:var(--r-inner);overflow:hidden;background:var(--surface)}
  .ov-imgs img{width:100%;height:auto}

  /* ---------- Reveal ---------- */
  @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .hero h1{animation:up .7s var(--ease) .05s both}
  .hero-sub{animation:up .7s var(--ease) .17s both}
  .hero-actions{animation:up .7s var(--ease) .28s both}
  .ob{opacity:0;transform:translateY(20px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
  .ob.in{opacity:1;transform:none}
  .btn:active{transform:scale(.97)}

  /* ---------- Responsivo ---------- */
  @media(max-width:1080px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .about{grid-template-columns:1fr}
    .about-text{border-right:0;border-bottom:1px solid var(--hairline-soft)}
    .about-photo{min-height:340px;order:2}
    .ov-imgs{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:760px){
    .nav-pill{display:none}
    .hero h1{max-width:none}
  }
  @media(max-width:620px){
    .nav .btn-primary{display:none}   /* o hero ja tem esse CTA */
    .nav{justify-content:space-between}
  }
  @media(max-width:560px){
    body{padding:8px}
    :root{--r-shell:20px;--r-card:16px;--r-inner:12px}
    .grid{grid-template-columns:1fr}
    .btn-lg{font-size:.92rem}
    .hero-actions .btn{width:100%;justify-content:space-between}
    .contact h2{max-width:none}
    .ov-imgs{grid-template-columns:1fr}
    footer{justify-content:center;text-align:center}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .card,.ob{opacity:1;transform:none}
    .brands-track{flex-wrap:wrap;width:auto;justify-content:center}
  }
</style>
</head>

  /* ---------------------------------------------------------------------
     MARCAS DO CARROSSEL (hero)
     Para usar o logo real: troque `ph:"Nome"` por `img:"logos/nome.svg"`.
     Ideal: SVG ou PNG transparente, altura ~80px, monocromático.
     --------------------------------------------------------------------- */
  const brands = [
    {name:"Quero Bolsa", ph:"Quero Bolsa"},
    {name:"Swift", ph:"Swift"},
    {name:"Igreja Batista Mais 500", ph:"Mais 500"},
    {name:"Prosper", ph:"Prosper"},
    {name:"LC Consultoria", ph:"LC Consultoria"},
    {name:"Preparadão Enem", ph:"Preparadão Enem"},
    {name:"Agência Maker Up", ph:"Maker Up"},
  ];

  function renderBrands(){
    const track=document.getElementById("brandsTrack");
    if(!track) return;
    track.innerHTML="";
    /* duas voltas da lista = loop sem emenda (a animação anda 50%) */
    for(let pass=0; pass<2; pass++){
      brands.forEach(b=>{
        let el;
        if(b.img){
          el=document.createElement("img");
          el.className="brand-logo"; el.src=b.img; el.alt=pass===0?b.name:"";
          el.loading="lazy";
        } else {
          el=document.createElement("span");
          el.className="brand-ph"; el.textContent=b.ph||b.name;
        }
        if(pass===1) el.setAttribute("aria-hidden","true");
        track.appendChild(el);
      });
    }
  }

  /* Rótulos das categorias (PT/EN) */
  const catLabels = {
    all:{pt:"Tudo",en:"All"},
    identidade:{pt:"Identidade Visual",en:"Visual Identity"},
    campanhas:{pt:"Campanhas",en:"Campaigns"},
    redes:{pt:"Redes Sociais",en:"Social Media"},
    email:{pt:"E-mail Marketing",en:"Email Marketing"},
    landingpage:{pt:"Landing Page",en:"Landing Page"},
    outros:{pt:"Outros",en:"Other"}
  };

  /* =====================================================================
     2) TEXTOS DA PÁGINA (PT/EN)
     ===================================================================== */
  const ARW = '<span class="arw">&#8594;</span>';
  const i18n = {
    pt:{
      navSvc:"Serviços", navWork:"Trabalhos", navAbout:"Sobre", navContactShort:"Contato",
      navContact:"Falar comigo"+ARW,
      heroTitle:'Comunicação é<br>a minha <em>arte.</em>',
      heroSub:"Sou a Rafa. Construo marcas que <b>existem com consistência</b> em qualquer canal — do símbolo à campanha, do feed à landing page.",

      ctaTalk:"Falar comigo"+ARW,
      svcEyebrow:"O que eu faço",

      s1t:"Identidade visual", s1d:"Símbolo, paleta, tipografia e manual de marca. O sistema completo pra sua marca ser reconhecida em qualquer lugar.",

      aboutP1:"Minha história nesse ramo começou cedo, muito antes de eu saber que tinha nome. Sempre gostei de edição e criava artes do zero por pura intuição. Na adolescência, comecei a criar peças para a minha igreja local como voluntária e foi ali que tudo fez sentido, descobri que <b>design era minha aptidão.</b>",
      aboutP2:"Desde então, entendi que design não é só beleza: ele é <b>estratégico, consistente e precisa fazer sentido pra quem o vê;</b> e para isso, você pode contar comigo!",

      contactTitle:'Vamos <em>conversar</em>',
      contactBtn:"Chamar no WhatsApp"+ARW,
      countSuffix:{one:"projeto",many:"projetos"}, saveBtn:"Ver projeto"
    },
    en:{
      navSvc:"Services", navWork:"Work", navAbout:"About", navContactShort:"Contact",
      navContact:"Get in touch"+ARW,
      heroTitle:'Communication is<br>my <em>craft.</em>',
      heroSub:"I'm Rafa. I build brands that <b>show up consistently</b> on every channel — from the mark to the campaign, from the feed to the landing page.",

      svcEyebrow:"What I do",

      s2t:"Campaigns", s2d:"From concept to final artwork. One idea that unfolds coherently across every channel the brand shows up in.",

      s5t:"Email marketing", s5d:"Flows and sends people actually open, with the same visual care as the rest of the brand.",
      workTitle:"Made here",
      aboutLabel:"About me",

      aboutSub:"I'm Rafa, a designer with over 8 years in the field.",
      aboutP1:"My story here started early, long before I knew it had a name. I always loved editing and made artwork from scratch on pure instinct. As a teenager I began designing for my local church as a volunteer, and that's when it clicked — I found out <b>design was my calling.</b>",
      aboutP2:"Since then I've understood that design isn't only about beauty: it's <b>strategic, consistent, and has to make sense to whoever sees it</b> — and that's where I come in.",
      contactEyebrow:"Next project",
      contactTitle:'Let\'s <em>talk</em>',
      contactBtn:"Message on WhatsApp"+ARW,
      countSuffix:{one:"project",many:"projects"}, saveBtn:"View project"
    }
  };

  /* ---------- estado ---------- */
  let lang = "pt";
  let filter = "all";

  /* ---------- tema ---------- */
  function toggleTheme(){
    const el=document.documentElement;
    el.setAttribute("data-theme", el.getAttribute("data-theme")==="dark"?"light":"dark");
  }

  /* ---------- idioma ---------- */
  function setLang(l){
    lang=l;
    document.documentElement.lang = l==="pt"?"pt-BR":"en";
    document.getElementById("lang-pt").classList.toggle("active",l==="pt");
    document.getElementById("lang-en").classList.toggle("active",l==="en");
    document.querySelectorAll("[data-i18n],[data-i18n-html]").forEach(el=>{
      const k=el.dataset.i18n||el.dataset.i18nHtml;
      const v=i18n[l][k];
      if(v!=null) el.innerHTML=v;
    });
    renderFilters(); renderGrid(); renderTags(l);
  }

  /* ---------- tags sobre ---------- */
  const tags = {
    pt:["Identidade Visual","Branding","Design Gráfico","Web Design","Campanhas","Redes Sociais","Landing Pages","Peças Offline"],
    en:["Visual Identity","Branding","Graphic Design","Web Design","Campaigns","Social Media","Landing Pages","Offline Materials"]
  };
  function renderTags(l){
    const box=document.getElementById("about-tags");
    if(!box) return;
    box.innerHTML="";
    tags[l].forEach(t=>{
      const s=document.createElement("span");
      s.className="about-tag";
      s.textContent=t;
      box.appendChild(s);
    });
  }

  /* ---------- filtros ---------- */
  function renderFilters(){
    const catOrder=["all","identidade","campanhas","email","landingpage"];
    const usedCats=new Set(projects.map(p=>p.cat));
    const cats=catOrder.filter(c=>c==="all"||usedCats.has(c));
    const box=document.getElementById("filters");
    box.innerHTML="";
    cats.forEach(c=>{
      const b=document.createElement("button");
      b.className="filter"+(c===filter?" active":"");
      b.textContent=(catLabels[c]?catLabels[c][lang]:c);
      b.onclick=()=>{filter=c;renderFilters();renderGrid();};
      box.appendChild(b);
    });
  }

  /* ---------- grid de trabalhos ---------- */
  function renderGrid(){
    const grid=document.getElementById("grid");
    grid.innerHTML="";
    const list=projects.filter(p=>filter==="all"||p.cat===filter);
    list.forEach((p,i)=>{
      const card=document.createElement("article");
      card.className="card";
      card.style.transitionDelay=(i%3*0.06)+"s";
      const cat=catLabels[p.cat]?catLabels[p.cat][lang]:p.cat;
      card.innerHTML=`
        <div class="card-head">
          <div class="card-tags">
            <span class="tag">${cat}</span>
            <span class="tag">${p.year}</span>
          </div>
          <h3>${p.title[lang]}</h3>
          ${p.desc[lang]?`<p class="card-desc">${p.desc[lang]}</p>`:""}
        </div>
        <div class="card-art">
          <img src="${p.img}" alt="${p.title[lang]}" loading="lazy">
          <span class="card-cta">${i18n[lang].saveBtn}<span class="arw">&#8594;</span></span>
        </div>`;
      card.onclick=()=>openProject(p);
      grid.appendChild(card);
    });
    const n=list.length, suf=i18n[lang].countSuffix;
    document.getElementById("count").textContent=
      String(n).padStart(2,"0")+" "+(n===1?suf.one:suf.many);
    requestAnimationFrame(()=>{
      document.querySelectorAll(".card").forEach(c=>obIO.observe(c));
    });
  }

  /* ---------- reveal ---------- */
  const obIO=new IntersectionObserver(es=>{
    es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");obIO.unobserve(e.target);}});
  },{threshold:.1});
  document.querySelectorAll(".ob").forEach(el=>obIO.observe(el));

  /* tags — escalonadas */
  const tagIO=new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(e.isIntersecting){
        e.target.querySelectorAll(".about-tag").forEach((t,i)=>{
          t.style.transitionDelay=(i*.04)+"s";
          t.classList.add("in");
        });
        tagIO.unobserve(e.target);
      }
    });
  },{threshold:.2});
  const tagsEl=document.getElementById("about-tags");
  if(tagsEl) tagIO.observe(tagsEl);

  /* ---------- overlay de projeto ---------- */
  const overlay=document.getElementById("projOverlay");

  function openProject(p){
    document.getElementById("projCat").textContent=(catLabels[p.cat]?catLabels[p.cat][lang]:p.cat)+" · "+p.year;
    document.getElementById("projTitle").textContent=p.title[lang];
    document.getElementById("projDesc").innerHTML=p.desc[lang]||"";
    document.getElementById("projDesc").style.display=p.desc[lang]?"":"none";
    const box=document.getElementById("projImages");
    box.className="ov-imgs"+(p.imgLayout==="stack"?" stack":"");
    box.innerHTML="";
    p.imgs.forEach(src=>{
      const d=document.createElement("div");
      const im=document.createElement("img");
      im.src=src; im.alt=""; im.loading="lazy";
      d.appendChild(im);
      box.appendChild(d);
    });
    overlay.classList.add("open");
    document.body.style.overflow="hidden";
    document.getElementById("projPanel").scrollTop=0;
  }

  function closeProject(){
    overlay.classList.remove("open");
    document.body.style.overflow="";
  }

  overlay.addEventListener("click",e=>{if(e.target===overlay)closeProject()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeProject()});

  setLang("pt");
  renderBrands();
</script>
